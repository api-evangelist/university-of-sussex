- aid: university-of-sussex:figshare-repository
  name: University of Sussex Research Data Repository (Figshare tenant)
  x-operator: tenant
  description: >-
    Sussex's institutional research repository, a Figshare tenant at sussex.figshare.com (CNAME to
    figshare.com). The relationship is independently confirmed by DataCite, where the university is
    a member provider (OTZZ) operating one repository client, FIGSHARE.SUSSEX, bound to the domain
    sussex.figshare.com. The data and the DOIs are Sussex's; the API is Figshare's generic v2
    contract. Ten copies of that contract were previously stored in this repository under Sussex's
    name — the same document eleven other institutions also shipped — and have been removed. The
    tenant host itself is behind an AWS WAF challenge (HTTP 202) and could not be probed on
    2026-08-30; that is a blocked probe, not a dead host.
  humanURL: https://sussex.figshare.com/
