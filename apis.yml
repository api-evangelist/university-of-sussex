apis:
- aid: university-of-sussex:identity-federation
  name: University of Sussex Shibboleth Identity Provider (SAML 2.0 metadata)
  x-operator: institution
  description: >-
    The university's own Shibboleth IdP, publishing signed SAML 2.0 metadata as a machine-readable
    EntityDescriptor. entityID https://idp.sussex.ac.uk/shibboleth, shibmd:Scope sussex.ac.uk,
    IDPSSODescriptor with protocolSupportEnumeration urn:oasis:names:tc:SAML:2.0:protocol and both
    signing and encryption KeyDescriptors. The host CNAMEs to uos-idp-shib-prod.uksouth.cloudapp.azure.com
    — a Sussex-operated deployment, not a vendor's shared service — which is what makes this the one
    institution-operated contract in this repository. It is metadata, not a REST API: there is no
    OpenAPI to save and none has been invented.
  humanURL: https://www.sussex.ac.uk/its/services/sso
