  state: gated
  reason: tenant_only
  detail: >-
    Sussex operates exactly one machine-readable contract of its own — the Shibboleth SAML 2.0
    identity-provider metadata at idp.sussex.ac.uk, whose host CNAMEs to a Sussex-run Azure
    instance (uos-idp-shib-prod.uksouth.cloudapp.azure.com), not to a vendor. Every other
    programmable surface reachable under a Sussex name is a vendor platform on a Sussex-branded
    hostname: okta.sussex.ac.uk CNAMEs to sussexac.customdomains.okta.com, canvas.sussex.ac.uk to
    universityofsussex-vanity.instructure.com, sussex.figshare.com to figshare.com, and library
    discovery is an Ex Libris Primo view (44SUS_INST). There is no developer portal, no
    institution-authored OpenAPI, no open-data portal (data.sussex.ac.uk and api.sussex.ac.uk do
    not resolve), and the GitHub organization has zero public repositories. One probe was blocked
    rather than answered: sussex.figshare.com returns an AWS WAF challenge (HTTP 202,
    x-amzn-waf-action: challenge, empty body) to every request including ?verb=Identify, so the
    Figshare tenant's OAI-PMH endpoint could not be confirmed either way. This profile previously
    carried ten OpenAPIs and thirty-eight artifacts derived from them; all ten were Figshare's
    generic v2 contract with an empty servers block, shipped identically by eleven other
    institutions, and have been removed.
