description: >-
  The University of Sussex is a research-intensive public university at Falmer near Brighton in
  the United Kingdom, a member of the Russell Group's peer set of UK research institutions and
  ranked #247 in the QS World University Rankings 2025. Its programmable footprint is small and
  almost entirely indirect, and this profile says so rather than padding it. The one surface the
  university genuinely operates and publishes machine-readably is its own Shibboleth identity
  provider: idp.sussex.ac.uk serves signed SAML 2.0 metadata with an entityID of
  https://idp.sussex.ac.uk/shibboleth and a shibmd:Scope of sussex.ac.uk, running on a
  Sussex-controlled Azure deployment rather than a vendor's multi-tenant service. Everything else
  that looks like a Sussex API is a vendor product running under a Sussex name: Okta for single
  sign-on at okta.sussex.ac.uk, Instructure Canvas for the VLE at canvas.sussex.ac.uk, Figshare
  for the research repository at sussex.figshare.com, and Ex Libris Primo for library discovery.
  Those relationships are recorded here as tenant surfaces because they are real institutional
  facts, but the contracts behind them belong to the vendors and are scored against the vendors'
  own profiles. Sussex operates no public developer portal, publishes no OpenAPI of its own, and
  its GitHub organization has no public repositories. The former Sussex Research Online EPrints
  repository and its OAI-PMH endpoint have been decommissioned and now redirect to an HTML
  publications page.
